<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CraveRank</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://unicrons.iconscout.com/release/v4.0.0/css/line.css"
    />
    <style>
      /* Remove bullet points and default padding/margin from the nav list */
      .nav_items {
        list-style: none;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="header"></div>

    <section class="home">
      <div class="form_container">
        <!-- Header with heading in the center and small exit icon in the top right -->
        <div class="form_header">
          <h1>Login to CraveRank</h1>
          <i class="uil uil-times form_close"></i>
        </div>

        <div class="form login_form">
          <form action="#">
            <div class="input_box">
              <!-- Optional icon for email/username -->
              <i class="uil uil-envelope input_icon"></i>
              <input
                type="text"
                name="username"
                placeholder="Username"
                required
              />
            </div>
            <div class="input_box">
              <i class="uil uil-lock input_icon"></i>
              <input
                type="password"
                name="password"
                placeholder="Password"
                required
              />
              <i class="uil uil-eye-slash pw_hide"></i>
            </div>
            <!-- Example submit button -->
            <button type="submit" class="button btn_submit">Login</button>

            <!-- "Don't have an account? Sign Up" link in purple -->
            <div class="redirect_text">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
